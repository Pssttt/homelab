# No tls block: Cloudflare terminates TLS at the edge and forwards to Traefik
# over plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-v2
spec:
  rules:
    {{- range concat (list .Values.ingress.webHost) (.Values.ingress.aliases | default list) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-v2-web
                port:
                  number: 3000
    {{- end }}

{{- if .Values.backup.enabled }}
# R2 credentials for the off-site snapshot upload.
#
# Ciphertext, generated on the node by `scripts/seal-psst-course-backup-r2.sh`. Only the
# sealed-secrets controller's private key can read it, so this is safe in git.
#
# SealedSecrets are bound to a namespace and name pair, so the identical token sealed as
# `unishare-backup-r2` in `default` could not be reused here and had to be re-sealed.
#
# Deliberately its own Secret rather than a key in psst-course-secrets: web.yaml consumes
# that one with envFrom, which injects every key into the internet-facing pod. An R2
# "Object Read & Write" token includes DeleteObject on every object in the bucket, so
# keeping it there would let a compromise of the app destroy the backups protecting it.
# Do not add an envFrom for this Secret.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: psst-course-backup-r2
  namespace: psst-course
spec:
  encryptedData:
    R2_ACCESS_KEY_ID: 
    R2_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: psst-course-backup-r2
      namespace: psst-course
{{- end }}

# No tls block: Cloudflare terminates TLS at the edge and the tunnel forwards to Traefik over
# plain HTTP (cloudflared-chart).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opengym
spec:
  rules:
    - host: opengym.psstee.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opengym
                port:
                  number: 80

# No tls block: Cloudflare terminates TLS at the edge and forwards to Traefik
# over plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doohickey
spec:
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: doohickey
                port:
                  number: {{ .Values.app.port }}

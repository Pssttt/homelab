# Generated with kubeseal 0.37.0 against this cluster's controller
# (sealed-secrets in kube-system), scoped to namespace `lonejob` / name
# `lonejob-secrets`. Only that controller can decrypt it, which is why it is safe
# to commit.
#
# Sealed-secrets binds BOTH namespace and name into the ciphertext under its
# default strict scope, so this file is valid ONLY for namespace `lonejob`. There
# is a single environment by design -- a preview environment for a single-user
# tool bought nothing but a second Postgres on a shared node.
#
# If a second environment is ever added, it needs its own seal generated against
# its own namespace; editing the namespace field here produces a secret the
# controller silently refuses to decrypt.
#
# NOTE: the controller's private key exists only inside this cluster and is
# backed up nowhere. If the cluster is lost, this file becomes permanently
# undecryptable -- regenerate rather than try to recover.
#
# Both model keys are sealed EMPTY on purpose. The app runs in analysis-only mode
# without them: every eligibility gate and every fit score is deterministic and
# needs no model, so this deploys and is useful before any key exists. The key
# NAMES are fixed by @ai-sdk/google and @ai-sdk/groq and must not be renamed.
#
# To add a key, re-seal ON the box -- plaintext must never leave it:
#
#   printf 'GOOGLE_GENERATIVE_AI_API_KEY=AIza...' > /tmp/k.env
#   sudo k3s kubectl create secret generic lonejob-secrets -n lonejob \
#     --from-env-file=/tmp/k.env --dry-run=client -o yaml \
#   | sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubeseal \
#       --controller-name sealed-secrets --controller-namespace kube-system \
#       --format yaml --merge-into <this file>
#   shred -u /tmp/k.env
#
# Free-tier keys: https://aistudio.google.com/apikey and
# https://console.groq.com/keys
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lonejob-secrets
  namespace: lonejob
spec:
  encryptedData:
    DATABASE_URL: 
    DB_PASSWORD: 
    GOOGLE_GENERATIVE_AI_API_KEY: 
    GROQ_API_KEY: 
  template:
    metadata:
      name: lonejob-secrets
      namespace: lonejob

# GHCR pull credential, sealed from a classic PAT with read:packages ONLY.
# Generated by scripts/seal-ghcr-pull.sh in the lone-job repo, which runs on the
# box so the token never leaves the machine holding the only key that can decrypt
# it -- and which refuses to seal a credential it cannot actually pull with,
# because a bad seal applies cleanly and only fails later at image-pull time.
#
# Needed because ghcr.io/pssttt/lonejob-web is private: it carries the full SQL
# schema and will carry the prompt architecture. This is the first
# imagePullSecret in this cluster -- every other workload here runs a public image.
#
# EXPIRY IS THE FAILURE MODE THIS PATTERN BRINGS. A classic PAT expires silently
# and surfaces months later as ImagePullBackOff on a deploy that used to work,
# with nothing in the pod logs pointing at the token. Check the PAT first.
#
# Namespace and name are bound into the ciphertext under sealed-secrets' default
# strict scope, so this file is valid only for namespace `lonejob`.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: lonejob
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: lonejob
    type: kubernetes.io/dockerconfigjson

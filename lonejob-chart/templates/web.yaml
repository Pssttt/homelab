apiVersion: apps/v1
kind: Deployment
metadata:
  name: lonejob-web
spec:
  replicas: {{ .Values.web.replicas }}
  # Recreate, not the default RollingUpdate. At one replica a rolling update
  # would briefly run two pods, each launching its own Chromium -- doubling peak
  # memory on a node shared with production for no availability gain, since a
  # single-replica Deployment has no redundancy to preserve anyway. Costs a few
  # seconds of downtime per rollout, which is correct for a single-user tool.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lonejob-web
  template:
    metadata:
      labels:
        app: lonejob-web
    spec:
      terminationGracePeriodSeconds: 30
      # The FIRST imagePullSecret in this cluster. Every other workload here runs
      # a public image, so there was no existing pattern to follow.
      #
      # Needed because ghcr.io/pssttt/lonejob-web is private: it carries the full
      # SQL schema and, later, the prompt architecture. Pod-level so it covers the
      # initContainer and the app container, which share one image.
      #
      # The secret is sealed from a classic PAT with read:packages only, by
      # scripts/seal-ghcr-pull.sh in the lone-job repo. If a deploy ever fails
      # with ImagePullBackOff after months of working, check the PAT's expiry
      # first -- that is the failure mode this pattern brings with it.
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        # Chromium maps shared memory here. The kubelet default is a 64Mi tmpfs,
        # which multi-page renders exceed; the failure presents as a bare
        # "Target closed" that reads like a timeout rather than an OOM.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.web.shmSize }}
      # Migrations run here, not as an ArgoCD PreSync hook. A PreSync hook fires
      # before the sync creates ANY resource, so on a first deploy it would try to
      # migrate a Postgres that does not exist yet and fail the whole sync. As an
      # initContainer the ordering is inherent -- Postgres and this pod are created
      # by the same sync, and the script waits for the database to accept
      # connections before touching it.
      #
      # Same image as the app, so the schema can never be at a different version
      # than the code that expects it. Safe at one replica; if replicas ever grow,
      # this needs to move to a Job with a lock.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          command: ["node", "dist/migrate.mjs"]
          envFrom:
            - secretRef:
                name: lonejob-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: PORT
              value: "{{ .Values.web.port }}"
            # Chromium navigates here to render the app's own /print routes, so
            # it must be the in-pod address: a public hostname would leave the
            # cluster, hit Cloudflare, and come back -- adding a dependency on
            # the edge being up in order to produce a PDF.
            - name: SELF_ORIGIN
              value: "http://127.0.0.1:{{ .Values.web.port }}"
            # Path to the distro Chromium installed in the image. Playwright
            # publishes no linux-arm64 browser build, so this is always explicit
            # and a bundled browser is never downloaded.
            - name: CHROMIUM_PATH
              value: /usr/bin/chromium-browser
            # Not credentials. Visible here so a wrong model id is noticed in
            # `kubectl get deploy -o yaml` rather than hidden in a sealed blob.
            # `provider:model` -- see models in values.yaml.
            - name: MODEL_DRAFT
              value: "{{ .Values.models.draft }}"
            - name: MODEL_CRITIC
              value: "{{ .Values.models.critic }}"
          envFrom:
            - secretRef:
                name: lonejob-secrets
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # NOT readOnlyRootFilesystem: Chromium writes crashpad state and
            # temp files, and the app writes temp PDFs for text extraction.
            # Those go to /tmp (HOME is set to /tmp in the image) rather than
            # anywhere persistent.
          readinessProbe:
            # /api/health reports each dependency separately and returns 503 when
            # any is down, so a database outage takes the pod out of the Service
            # rather than serving requests that will fail.
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # Deliberately a TCP check, not /api/health. Liveness restarts the
            # pod, and a Postgres blip must not do that -- the process is fine and
            # readiness already handles removing it from the Service.
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let endpoint removal propagate before SIGTERM so requests aren't
              # routed to a dying pod. Matters more here than usual: a PDF render
              # can be mid-flight and takes seconds, not milliseconds.
              sleep:
                seconds: 5

apiVersion: v1
kind: Service
metadata:
  name: lonejob-web
  # `app` label carried on the Service too, so a ServiceMonitor can select it
  # without a separate change when monitoring.enabled is turned on.
  labels:
    app: lonejob-web
spec:
  selector:
    app: lonejob-web
  ports:
    # Named, because ServiceMonitor endpoints reference a port by name.
    - name: http
      port: 3000
      targetPort: 3000

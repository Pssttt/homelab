apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lonejob-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lonejob-postgres
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. One replica on a ReadWriteOnce
  # local-path volume cannot have two pods mounted at once, so a rolling update
  # deadlocks: the new pod sits Pending on a volume the old pod still holds, and
  # the old pod is never terminated because the new one never becomes Ready.
  # Any image or env change trips this, so it is set from the start rather than
  # discovered on the first bump.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lonejob-postgres
  template:
    metadata:
      labels:
        app: lonejob-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lonejob-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-q"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: lonejob-postgres-pvc

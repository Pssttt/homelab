# Personal AI job-application workspace. Single user, no auth: the only thing
# standing between the public internet and this app is that its hostname is not
# published. That is acceptable for a tool holding a CV and job notes, and it is
# stated here so nobody assumes otherwise later.
#
# Image tags are written by CI (.github/workflows/docker.yml in the lone-job
# repo) on every push to main. Do not edit by hand -- the next deploy overwrites
# a manual edit, and CI force-pushes nothing, so a conflicting edit fails the
# pipeline instead of silently winning.
#
# These are the PRODUCTION defaults. The dev environment overlays them from
# ../lonejob-values-dev.yaml (see apps/lonejob-dev.yaml); anything it does not
# override it inherits from here, so a new key added below lands in both
# environments unless dev opts out.

# Selects which SealedSecret template renders. Sealed-secrets binds the target
# namespace into the ciphertext, so each environment needs its own seal rather
# than the same blob with a different namespace field -- hence a switch here
# instead of a templated namespace.
env: prod
image:
  web:
    repository: ghcr.io/pssttt/lonejob-web
    # Pinned by hand to the first image CI published, because the GitOps
    # write-back was still skipped at that point (GITOPS_APP_* secrets absent).
    # CI takes over this line on the next push once those secrets exist, so
    # reading this file always tells you which commit is deployed.
    tag: "sha-c6f180666db06dff4b2c4531a34e7adc841ea9c6"
web:
  port: 3000
  # ONE replica, and this is not a capacity choice. The renderer keeps a single
  # Chromium process alive per pod and caches it on globalThis; two replicas
  # would double that resident memory for a tool with one user. It also keeps
  # the strategy: Recreate note below honest.
  replicas: 1
  # Chromium is the memory-heaviest thing on this node. Unlike unishare's
  # production pods (which run unlimited because they always have), this is
  # capped from day one: an OOM-killed render is recoverable -- the code drops
  # the cached browser and relaunches -- whereas an unbounded Chromium leak on a
  # node shared with production is not.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 1280Mi
  # Memory-backed /dev/shm for Chromium. The kubelet default is 64Mi, which
  # Chromium exceeds on multi-page documents and then crashes with a bare
  # "Target closed" that looks like a timeout rather than an OOM. The renderer
  # also passes --disable-dev-shm-usage as a second line of defence; both are
  # kept because either alone has been observed to be insufficient elsewhere.
  shmSize: 256Mi
# Model ids live in plain env, not the sealed secret: they are not credentials,
# and being visible here is how a wrong value gets noticed rather than hiding in
# a sealed blob. Changing one is a values edit plus a pod restart, not a rebuild
# -- which matters because free-tier model availability moves faster than this
# app will.
#
# Format is `provider:model`, resolved through the registry in lib/ai/client.ts.
# Only `google` and `groq` are registered; anything else fails fast with a message
# naming the offending value.
models:
  # Both probed against the live APIs on the configured keys, 2026-08-05. Neither
  # id is written from memory -- an earlier config carried gemini-2.5-pro, which
  # turns out to have zero free quota and would have failed on its first call.
  #
  # GEMINI:  gemini-3.6-flash / 3.5-flash / 2.5-flash  -> 200, responseSchema honoured
  #          every *-pro model                          -> 429 RESOURCE_EXHAUSTED
  #          Pro has NO free quota. That is a hard 429, not a rate limit, so it
  #          never clears on retry. Do not "upgrade" to pro without billing.
  #
  # GROQ:    openai/gpt-oss-120b      -> 200, strict json_schema honoured
  #          openai/gpt-oss-20b       -> 400, failed to satisfy the schema
  #          llama-3.3-70b-versatile  -> 400, does not support json_schema
  #          qwen/qwen3.6-27b         -> 400, does not support json_schema
  #          Only gpt-oss-120b is usable, because the critic returns
  #          machine-appliable edits and needs strict schema enforcement rather
  #          than best-effort "JSON mode".
  #
  # COMMA-SEPARATED FALLBACK CHAINS, tried left to right. A single id here would
  # silently disable half the rate-limit handling: the app paces requests and
  # honours a stated Retry-After either way, but with one model per role there is
  # nowhere to fall back to when a provider hits its per-minute wall. That wall is
  # real and low -- Gemini free tier answered "limit: 20, model gemini-3.6-flash,
  # please retry in 49s" on a live run, and one application spends three drafter
  # calls.
  #
  # Groq leads the DRAFT chain because its free limits are several times Gemini's.
  # Gemini leads the CRITIC chain so the default pairing is cross-family in both
  # directions: whichever provider drafts, the other reviews. The app enforces
  # that by skipping any critic candidate sharing the drafter's family, so these
  # two lists must never be identical.
  draft: "groq:openai/gpt-oss-120b,google:gemini-3.6-flash,google:gemini-2.5-flash"
  # A genuinely different model lineage from the drafter, which is the whole point
  # of having a critic: one that shares the drafter's training data shares its
  # blind spots and agrees with the same mistakes.
  critic: "google:gemini-3.6-flash,groq:openai/gpt-oss-120b,google:gemini-2.5-flash"
# Off for now, and deliberately: nothing here emits /metrics yet, so a
# ServiceMonitor would scrape a 404 every 15s and a PrometheusRule would have
# nothing to alert on. Turn on together with the metrics endpoint, and copy
# unishare-chart's pattern -- including `namespace: "{{ .Release.Namespace }}"`
# on every alert label, without which Alertmanager silently drops it.
monitoring:
  enabled: false
postgres:
  user: postgres
  database: lonejob
  image: postgres:18-alpine
  # Advisory only -- local-path enforces no capacity. Stated to document intent.
  # Text and JSONB only; the portfolio PDFs and project images live in Garage,
  # not in rows, so this stays small.
  storage: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # NO BACKUPS YET, on purpose. The database is empty until the profile and
  # project corpus are imported, and building a pg_dump -> R2 pipeline for an
  # empty schema is work that protects nothing.
  #
  # This MUST be revisited the moment real application history exists, because
  # local-path has reclaimPolicy: Delete and lives on the same node as the data
  # it holds -- so deleting the PVC, or losing the node, loses everything with no
  # second copy. Copy unishare-chart/templates/postgres-backup-cronjob.yaml
  # (pg_dump -Fc, pg_restore --list verification, find -mtime pruning, rclone to
  # R2) and seal the R2 credentials into lonejob-secrets.
  backup:
    enabled: false
# SINGLE label under psstee.me, deliberately: Cloudflare's edge cert covers
# `psstee.me` and `*.psstee.me` only, and that wildcard matches one label, so
# `dev.lonejob.psstee.me` would fail TLS at the edge with an sslv3 handshake
# alert. This Ingress carries no `tls:` block for the same reason -- Cloudflare
# terminates TLS upstream, so there is nothing for cert-manager to do.
ingress:
  webHost: lonejob.psstee.me

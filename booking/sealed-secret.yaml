# Booking app settings, the form owner details, notification keys and the Postgres password.
# Sealed on the node against booking/booking-env; only the cluster controller can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: booking-env
  namespace: booking
spec:
  encryptedData:
    BOOKING_DEGREE: 
    BOOKING_DEPARTMENT: 
    BOOKING_EMAIL: 
    BOOKING_FACULTY: 
    BOOKING_NAME: 
    BOOKING_PHONE: 
    BOOKING_STUDENT_CODE: 
    BOOKING_TYPE_OF_CLIENT: 
    BOOKING_YEAR_OF_STUDY: 
    CANCEL_PASSWORD: 
    CONFIRMATION_EMAIL: 
    DATABASE_URL: 
    DISCORD_WEBHOOK_URL: 
    GOOGLE_FORM_SUBMIT_URL: 
    GOOGLE_FORM_URL: 
    POSTGRES_PASSWORD: 
    RESEND_API_KEY: 
    RESEND_FROM_EMAIL: 
    TELEGRAM_BOT_TOKEN: 
    TELEGRAM_CHAT_ID: 
  template:
    metadata:
      name: booking-env
      namespace: booking

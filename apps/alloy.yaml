apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.13.1"
    helm:
      valuesObject:
        crds:
          create: false
        controller:
          # One API-based log collector avoids duplicate ingestion on this
          # single-node cluster. Revisit clustering when adding replicas.
          type: deployment
          replicas: 1
        alloy:
          enableReporting: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
                  regex = "([^;]+);.*|;(.+)"
                  replacement = "$1$2"
                  target_label = "service_name"
                }
                rule {
                  replacement = "unicorp"
                  target_label = "cluster"
                }
              }

              loki.source.kubernetes "pods" {
                targets = discovery.relabel.logs.output
                forward_to = [loki.write.local.receiver]
              }

              loki.write "local" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              otelcol.receiver.otlp "apps" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output {
                  traces = [otelcol.processor.memory_limiter.apps.input]
                }
              }

              otelcol.processor.memory_limiter "apps" {
                check_interval = "1s"
                limit = "384MiB"
                spike_limit = "96MiB"
                output {
                  traces = [otelcol.processor.transform.redact.input]
                }
              }

              // Keep route templates and operation names. Authentication URLs
              // can contain codes/tokens; SQL text can contain literal values.
              otelcol.processor.transform "redact" {
                error_mode = "ignore"
                trace_statements {
                  context = "span"
                  statements = [
                    `delete_key(attributes, "url.full")`,
                    `delete_key(attributes, "url.query")`,
                    `delete_key(attributes, "http.url")`,
                    `delete_key(attributes, "http.target")`,
                    `delete_key(attributes, "db.statement")`,
                    `delete_key(attributes, "db.query.text")`,
                  ]
                }
                output {
                  traces = [otelcol.processor.batch.apps.input]
                }
              }

              otelcol.processor.batch "apps" {
                timeout = "5s"
                send_batch_size = 256
                send_batch_max_size = 512
                output {
                  traces = [otelcol.exporter.otlp.tempo.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.monitoring.svc.cluster.local:4317"
                  tls { insecure = true }
                }
              }
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opengym
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pssttt/homelab
    targetRevision: main
    path: opengym
  destination:
    server: https://kubernetes.default.svc
    namespace: opengym
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: "3.1.0"
    helm:
      valuesObject:
        tempo:
          reportingEnabled: false
          retention: 168h
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          querier:
            max_concurrent_queries: 4
          queryFrontend:
            search:
              concurrent_jobs: 20
          overrides:
            defaults:
              ingestion:
                rate_limit_bytes: 1000000
                burst_size_bytes: 2000000
              global:
                max_bytes_per_trace: 5000000
        persistence:
          enabled: true
          storageClassName: local-path
          size: 5Gi
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Image tags are written by CI (.github/workflows/deploy.yml in the
# portfolio-next repo) on every push to main. Do not edit by hand.
image:
  web:
    repository: ghcr.io/pssttt/portfolio-next
    tag: "sha-25856c7fe63e7c63883b62edc3e19f15506450ac"
web:
  port: 3000
  resendFromEmail: contact@notify.psstee.me
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
# The terminal-style site moved here when psstee.me switched to portfolio-v2.
ingress:
  webHost: terminal.psstee.me
  aliases: []

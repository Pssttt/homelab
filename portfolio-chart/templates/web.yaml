apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: portfolio-web
  template:
    metadata:
      labels:
        app: portfolio-web
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/sealed-secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: PORT
              value: "{{ .Values.web.port }}"
            - name: RESEND_FROM_EMAIL
              value: {{ .Values.web.resendFromEmail | quote }}
          envFrom:
            - secretRef:
                name: portfolio-secrets
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
